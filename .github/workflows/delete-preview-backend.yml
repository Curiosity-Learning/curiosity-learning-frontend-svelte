name: Delete preview backend

# When a PR is merged or closed, delete the Convex preview backend its Vercel preview used
# (CL-810). Same rules as `npm run worktree:remove`: only when the branch's PR is merged or
# closed, never prod or shared dev. Needs the CONVEX_TEAM_ACCESS_TOKEN repo secret (a Convex team
# access token); without it the job is skipped and `npm run worktree:prune` remains the fallback.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  delete:
    name: Delete the branch's Convex preview backend
    # Fork PRs get no secrets and never had a preview backend of ours.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_TEAM_ACCESS_TOKEN }}
      # Project curiosity-learning-flutter-to-svelte; a team token cannot list teams by slug.
      CONVEX_PROJECT_ID: '1629963'
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Skip without a Convex token
        if: env.CONVEX_ACCESS_TOKEN == ''
        run: echo "CONVEX_TEAM_ACCESS_TOKEN is not set; skipping. Run npm run worktree:prune instead."

      # Run the script from the default branch, not from the closed PR's code.
      - name: Check out code
        if: env.CONVEX_ACCESS_TOKEN != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        if: env.CONVEX_ACCESS_TOKEN != ''
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Delete the preview backend
        if: env.CONVEX_ACCESS_TOKEN != ''
        run: node scripts/worktree/cli.mjs delete-preview "$HEAD_REF"
