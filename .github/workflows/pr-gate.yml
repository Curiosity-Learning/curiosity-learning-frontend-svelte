name: PR Gate

on:
  pull_request:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: pr-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Install, typecheck, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_CONVEX_URL: https://example.invalid
      PUBLIC_CONVEX_SITE_URL: https://example.invalid
      BETTER_AUTH_URL: http://localhost:5173
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-for-production

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint:ci

      # Server project only: the client project needs Playwright browsers.
      - name: Unit tests
        run: npx vitest run --project server

      - name: Build
        run: npm run build
